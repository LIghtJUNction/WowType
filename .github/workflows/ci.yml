name: CI

# PR 和推送到 main：验证安装器、更新器及各发行版构建，安装包保存在 Artifacts。
# 只改了文档（*.md、docs/、截图）的提交不跑。
# 推送 v* 标签（git tag v0.1.0 && git push origin v0.1.0）：总是跑，并把这些包发到 GitHub Release。
# 其他分支想跑一次：Actions 页手动运行（workflow_dispatch）。

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: 安装与更新回归
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: for script in install.sh scripts/*.sh; do bash -n "$script"; done
      - run: bash scripts/test-install.sh
      - run: python3 scripts/test-update.py

  core:
    name: Rust 核心测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libx11-dev libxkbcommon-dev
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - name: C ABI 冒烟测试
        run: ./scripts/abi-smoke.sh

  data:
    name: 词库（rime-ice）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/make-data.sh "" dist/data
      - run: scripts/package-deb.sh data dist/data dist/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: dist/data
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-data
          path: dist/pkg

  addon:
    name: 插件 · ${{ matrix.distro }}
    needs: data
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu24.04, image: "ubuntu:24.04" }
          - { distro: ubuntu26.04, image: "ubuntu:26.04" }
          - { distro: debian13, image: "debian:trixie" }
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: 系统依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake extra-cmake-modules \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev libasound2-dev \
            fcitx5 fcitx5-modules \
            ca-certificates curl git dpkg-dev file python3 \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.distro }}
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 打包
        run: scripts/package-deb.sh engine "$VERSION" dist/pkg
      - name: 用一键安装脚本装上试一下
        run: |
          mkdir -p /tmp/inst && cp dist/pkg/wowtype_*.deb /tmp/inst/
          (cd /tmp/inst && sha256sum -- *.deb > SHA256SUMS)
          WOWTYPE_VERSION="$VERSION" WOWTYPE_BASE_URL=file:///tmp/inst WOWTYPE_YES=1 ./install.sh
          # fcitx5 没在跑：脚本直接把 WowType 写进 fcitx5 的输入法列表
          grep -qx 'Name=wowtype' "$HOME/.config/fcitx5/profile"
          ls /usr/lib/*/fcitx5/libwowtype.so
          # 词库和语言模型在安装包里
          test -s /usr/share/wowtype/words.lm && test -s /usr/share/wowtype/english.txt
          cmp /usr/share/wowtype/lexicon.tsv dist/data/lexicon.tsv
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee /tmp/show.txt
          grep -q '1\.你好' /tmp/show.txt
          # 设置界面：能 import GTK 4 / libadwaita，拼音整理逻辑正确
          wowtype-config --self-test
          # 图标装到 hicolor，输入法和设置界面都指向它
          test -f /usr/share/icons/hicolor/scalable/apps/wowtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/wowtype.png
          grep -qx 'Icon=wowtype' /usr/share/fcitx5/inputmethod/wowtype.conf
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.distro }}
          path: dist/pkg

  arch:
    name: 插件 · archlinux
    needs: data
    runs-on: ubuntu-24.04
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        # rust 包自带 cargo；fcitx5 包含 CMake 配置和按键测试用的 testim 插件。
        # 设置界面也在安装后测试，故装好 GTK / PyGObject（包本身把它们列为可选依赖）。
        run: |
          pacman -Syu --noconfirm --needed base-devel cmake extra-cmake-modules \
            fcitx5 alsa-lib rust pkgconf python git ca-certificates util-linux \
            python-gobject gtk4 libadwaita curl
          useradd --create-home builder
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 用 makepkg 打 pacman 包（普通用户、从源码重建）
        run: |
          install -d -o builder -g builder dist/pkg
          runuser -u builder -- scripts/package-arch.sh "$VERSION" dist/pkg
      - name: 用一键安装脚本安装 Arch 包
        run: |
          # archlinux 容器的 pacman.conf 用 NoExtract 跳过了 /usr/share/doc 等，
          # 不去掉的话 pacman -Qkk 会把没解出来的文档当成文件缺失
          sed -i '/^NoExtract/d' /etc/pacman.conf
          (cd dist/pkg && sha256sum -- *.pkg.tar.zst > SHA256SUMS)
          WOWTYPE_VERSION="$VERSION" WOWTYPE_BASE_URL="file://$PWD/dist/pkg" WOWTYPE_YES=1 ./install.sh
          pacman -Qip dist/pkg/wowtype-*.pkg.tar.zst
          pacman -Qkk wowtype
          test -f /usr/lib/fcitx5/libwowtype.so
          ldd /usr/lib/fcitx5/libwowtype.so | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo '插件有未解析的动态库依赖' >&2
            exit 1
          fi
          test -s /usr/share/wowtype/words.lm
          test -s /usr/share/wowtype/english.txt
          cmp /usr/share/wowtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/wowtype/words.lm dist/data/words.lm
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          # 不用 grep -q 直接接在管道后面，避免 pipefail 把上游 SIGPIPE 当成测试失败。
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          wowtype-config --self-test
          test -f /usr/share/icons/hicolor/scalable/apps/wowtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/wowtype.png
          grep -qx 'Icon=wowtype' /usr/share/fcitx5/inputmethod/wowtype.conf
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-archlinux
          path: dist/pkg/*.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: 插件 · fedora${{ matrix.version }}
    needs: data
    runs-on: ubuntu-24.04
    container: fedora:${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [43, 44, 45]
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        # fcitx5-devel 带 CMake 配置；fcitx5 带按键测试用的 testim 插件。
        # 设置界面也在安装后测试，故装好 GTK / PyGObject（包本身把它们列为推荐依赖）。
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rust cargo cmake extra-cmake-modules gcc-c++ pkgconf-pkg-config \
            fcitx5 fcitx5-devel alsa-lib-devel rpm-build \
            python3 python3-gobject gtk4 libadwaita gobject-introspection \
            git ca-certificates findutils file which curl
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 按键测试（私有 fcitx5 实例 + 真实词库和语言模型）
        run: WOWTYPE_LM="$PWD/dist/data/words.lm" scripts/addon-test.sh "$PWD/dist/data/lexicon.tsv" "$PWD/dist/data/english.txt"
      - name: 版本号
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' core/Cargo.toml | head -1)
            version="${base}~git$(date -u +%Y%m%d).$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: 用 rpmbuild 打 rpm 包（从源码重建）
        run: scripts/package-rpm.sh "$VERSION" dist/pkg
      - name: 用一键安装脚本安装 Fedora 包
        run: |
          # fedora 容器的 dnf 默认 tsflags=nodocs，去掉免得 rpm -V 把没装的文档当成缺失
          sed -i '/^tsflags=nodocs/d' /etc/dnf/dnf.conf
          (cd dist/pkg && sha256sum -- *.rpm > SHA256SUMS)
          WOWTYPE_VERSION="$VERSION" WOWTYPE_BASE_URL="file://$PWD/dist/pkg" WOWTYPE_YES=1 ./install.sh
          rpm -qip dist/pkg/wowtype-*.rpm
          rpm -V wowtype
          # Fedora 的 fcitx5 插件目录是 /usr/lib64/fcitx5
          test "$(pkg-config --variable=libdir Fcitx5Core)/fcitx5" = /usr/lib64/fcitx5
          test -f /usr/lib64/fcitx5/libwowtype.so
          ldd /usr/lib64/fcitx5/libwowtype.so | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then
            echo '插件有未解析的动态库依赖' >&2
            exit 1
          fi
          test -s /usr/share/wowtype/words.lm
          test -s /usr/share/wowtype/english.txt
          cmp /usr/share/wowtype/lexicon.tsv dist/data/lexicon.tsv
          cmp /usr/share/wowtype/words.lm dist/data/words.lm
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          # 不用 grep -q 直接接在管道后面，避免 pipefail 把上游 SIGPIPE 当成测试失败。
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          wowtype-config --self-test
          # fcitx5 没在跑：直接把 WowType 写进 fcitx5 的输入法列表
          wowtype-config --add-to-group
          grep -qx 'Name=wowtype' "$HOME/.config/fcitx5/profile"
          test -f /usr/share/icons/hicolor/scalable/apps/wowtype.svg
          test -f /usr/share/icons/hicolor/22x22/apps/wowtype.png
          grep -qx 'Icon=wowtype' /usr/share/fcitx5/inputmethod/wowtype.conf
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-fedora${{ matrix.version }}
          path: dist/pkg/*.rpm
          if-no-files-found: error

  opensuse:
    name: 源码安装 · openSUSE Tumbleweed
    needs: data
    runs-on: ubuntu-24.04
    container: opensuse/tumbleweed:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 系统依赖
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install --no-recommends \
            rust cargo gcc-c++ make cmake extra-cmake-modules pkgconf-pkg-config \
            fcitx5 fcitx5-devel alsa-devel python3 python3-gobject python3-gobject-Gdk \
            typelib-1_0-Gtk-4_0 typelib-1_0-Adw-1 git ca-certificates file findutils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: data
          path: dist/data
      - name: 编译并安装到系统 Fcitx 目录
        run: |
          cargo build --release --locked -p wowtype-core
          cmake -S fcitx5-addon -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j"$(nproc)"
          cmake --install build
          install -m755 target/release/wowtype-check target/release/wowtype-show /usr/bin/
          install -m644 dist/data/lexicon.tsv dist/data/english.txt dist/data/words.lm /usr/share/wowtype/
      - name: 插件路径、依赖、真实词库和设置界面
        run: |
          addon_dir="$(pkg-config --variable=libdir Fcitx5Core)/fcitx5"
          test -f "$addon_dir/libwowtype.so"
          ldd "$addon_dir/libwowtype.so" | tee dist/ldd.txt
          if grep -q 'not found' dist/ldd.txt; then exit 1; fi
          test -f /usr/share/fcitx5/addon/wowtype.conf
          test -f /usr/share/fcitx5/inputmethod/wowtype.conf
          wowtype-check --lexicon /usr/share/wowtype/lexicon.tsv --s2t /usr/share/wowtype/s2t.tsv
          wowtype-show --lexicon /usr/share/wowtype/lexicon.tsv nihao | tee dist/show.txt
          grep -q '1\.你好' dist/show.txt
          wowtype-config --self-test

  nix:
    name: Nix flake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # 构建插件（词库按 flake 里固定的哈希从发布页下载），再跑 checks：
      # 自检工具用装好的词库打出「你好」、设置界面自测
      - run: nix build .#default -L
      - run: nix flake check -L

  release:
    name: 发布
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, core, data, addon, arch, fedora, opensuse, nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: 校验和
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## 安装（Ubuntu / Debian、Arch Linux、Fedora）

          一行命令（下载对应发行版的安装包、装好、加进 fcitx5 输入法列表）：

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | bash
          \`\`\`

          或者手动下载和你系统对应的一个 \`wowtype_<版本>_<发行版>_amd64.deb\`（词库已经在包里），然后 \`sudo apt install ./wowtype_*_amd64.deb\`。
          Arch Linux / EndeavourOS / Garuda / CachyOS：一键脚本会先完整升级系统，再用 pacman 安装对应包。
          Fedora 43 / 44 / 45：自动选择与系统版本一致的 RPM。Debian 13、Ubuntu 24.04 / 26.04 及明确声明兼容基线的衍生版使用对应 deb。
          Manjaro：按安装说明在本机用 makepkg 打包；openSUSE Tumbleweed：按安装说明从源码构建。
          NixOS：用仓库里的 flake，把 \`inputs.wowtype.packages.<system>.default\` 加进 \`i18n.inputMethod.fcitx5.addons\`，见[安装说明](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md)。
          完整步骤见 [README](https://github.com/${GITHUB_REPOSITORY}#安装)。

          安装包里的词库来自 [rime-ice](https://github.com/iDvel/rime-ice)（GPL-3.0），词级语言模型 words.lm 是 CC BY-SA 4.0。

          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "WowType $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
